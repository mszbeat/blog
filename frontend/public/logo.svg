<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Zlog">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5ae6"/>
      <stop offset="0.55" stop-color="#8b78f0"/>
      <stop offset="1" stop-color="#d94f9d"/>
    </linearGradient>
    <linearGradient id="zFace" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fcd27a"/>
      <stop offset="1" stop-color="#e79a2b"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#tile)"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="29.25" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- Z: the signature letter. Uppercase, oversized, apricot — its own hue and
       its own weight, so it reads as a monogram rather than the first
       character of a word. Sized against a WIDE fallback face so the wordmark
       still fits the tile when Inter is unavailable. -->
  <text x="19" y="86" font-family="Inter, Vazirmatn, ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="58" font-weight="800" letter-spacing="-1" fill="url(#zFace)">Z</text>

  <!-- log: lowercase, quiet, white -->
  <text x="57" y="86" font-family="Inter, Vazirmatn, ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="34" font-weight="700" letter-spacing="-1.5" fill="#ffffff" fill-opacity="0.95">log</text>
</svg>
